name: Update Blog Posts

on:
  schedule:
    - cron: '0 */3 * * *'   # 3시간마다 자동 실행
  workflow_dispatch:         # "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Naver blog RSS and build posts.json
        run: |
          python3 - <<'PYEOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import datetime

          url = "https://rss.blog.naver.com/winfiend.xml"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=20) as resp:
              data = resp.read()

          root = ET.fromstring(data)
          items = root.findall('./channel/item')[:3]
          posts = []
          for it in items:
              title = (it.findtext('title') or '').strip()
              link = (it.findtext('link') or '').strip()
              pub = (it.findtext('pubDate') or '').strip()
              date_str = ''
              try:
                  dt = datetime.datetime.strptime(pub, '%a, %d %b %Y %H:%M:%S %z')
                  date_str = dt.strftime('%Y.%m.%d')
              except Exception:
                  pass
              posts.append({"title": title, "link": link, "date": date_str})

          with open('posts.json', 'w', encoding='utf-8') as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)

          print(json.dumps(posts, ensure_ascii=False, indent=2))
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --staged --quiet || git commit -m "블로그 최신 글 자동 업데이트"
          git push
